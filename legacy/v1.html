<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171419"><title>THE BRIEF. | Academy & Firm</title>
<style>
:root{font-family:Georgia,serif;color:#f5ece3;background:#171419}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1000px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #59434a;padding:12px 0 20px}.logo{font-size:23px;font-weight:bold;letter-spacing:2px}.sub,.muted{color:#bcaeaa}.sub{font:11px Arial;letter-spacing:2px}.nav{display:flex;gap:8px;overflow:auto;margin:24px 0}.nav button,.btn{background:#31252b;color:#f7e9e0;border:1px solid #6b4a51;border-radius:9px;padding:12px 16px}.nav button.active,.btn.primary{background:#703343}.hero{background:linear-gradient(115deg,#3c232c,#211a20);border:1px solid #78535d;border-radius:18px;padding:32px;margin:20px 0}.hero h1{font-size:clamp(30px,6vw,52px);margin:8px 0}.tag{color:#d6b19b;font:12px Arial;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #60434a;background:#261e24;padding:22px;border-radius:14px}.card h3{margin-top:0}.metric{font-size:30px;color:#e5c2a9}.panel{max-width:740px}.btn{margin:6px 6px 6px 0}.btn:disabled{opacity:.5}textarea{width:100%;min-height:125px;background:#1a161b;border:1px solid #78535d;color:#fff;padding:14px;border-radius:9px}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;background:#30242b;color:#f7e9e0;border:1px solid #684650;border-radius:9px}.option.selected{border-color:#e5c2a9;background:#50323b}.notice{border-left:3px solid #c7a38f;padding:10px 14px;background:#34272d;margin:14px 0;line-height:1.6}.hidden{display:none}p{line-height:1.65}footer{font:12px Arial;color:#ad9d9d;padding:30px 0}.pill{font:11px Arial;border:1px solid #75545b;padding:6px 9px;border-radius:30px;color:#d8b9a9}a{color:#e8b9a9}
</style></head><body><div class="shell"><header class="top"><div><div class="logo">THE BRIEF.</div><div class="sub">LAW ACADEMY / VIRTUAL FIRM</div></div><span class="pill">EDITORIAL LUXURY</span></header><nav class="nav" id="nav"></nav><main id="view"></main><footer>THE BRIEF. is an educational simulation, not legal advice. Fictional firm roles do not represent professional credentials. Progress is saved in this browser; export backups regularly.</footer></div>
<script>
const KEY='the-brief-v1', initial={answered:{},lessons:[],caseStep:0,caseNotes:{},started:false};
let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){data=structuredClone(initial)}
let page='home',question=0,chosen=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const tabs=[['home','My Office'],['academy','The Academy'],['firm','The Firm'],['docket','Weekly Docket'],['progress','Progress']];
const questions=[
{type:'Logical Reasoning',q:'Every contract reviewed by the legal team was approved by a manager. Some vendor agreements were reviewed by the legal team. Which statement must be true?',a:['All vendor agreements were manager-approved.','Some vendor agreements were manager-approved.','No vendor agreements were manager-approved.','Only vendor agreements require approval.'],correct:1,why:'The agreements in the overlap were reviewed, so each of those was approved. Nothing establishes that all vendor agreements were reviewed.'},
{type:'Logical Reasoning',q:'A manager argues: “Since misconduct reports increased after we introduced anonymous reporting, misconduct itself must have increased.” Which objection is strongest?',a:['Anonymous reporting may have increased detection rather than misconduct.','Reports always exaggerate misconduct.','Anonymous reporting prevents misconduct.','The manager is necessarily dishonest.'],correct:0,why:'The argument confuses the number of reports with the underlying incidence of misconduct.'},
{type:'Logical Reasoning',q:'A firm will open a new office only if it secures funding. The firm opened a new office. What follows?',a:['Funding was secured.','The office is profitable.','Funding guarantees success.','The firm has no debt.'],correct:0,why:'“Only if” states a necessary condition: opening implies funding.'},
{type:'Reading Comprehension',q:'Passage: A legal historian argues that publishing judicial opinions improves transparency but does not, by itself, guarantee public understanding. Specialized terminology can make opinions difficult for nonlawyers to interpret. What is the main point?',a:['Judicial opinions should never be published.','Transparency and accessibility are distinct goals.','Specialized language is always unnecessary.','Only lawyers should read opinions.'],correct:1,why:'The passage distinguishes making opinions available from making them understandable.'},
{type:'Logical Reasoning',q:'A compliance officer says: “All employees who completed training passed the assessment. Jordan passed the assessment, so Jordan completed training.” What is the flaw?',a:['Treating a sufficient condition as necessary.','Assuming no one passed.','Using a sample that is too large.','Rejecting a definition.'],correct:0,why:'Completing training guarantees passing, but passing does not establish how Jordan prepared.'}
];
const lessons=[
{title:'Contracts: Offer & Acceptance',body:'A contract typically requires mutual assent, consideration, and other conditions of enforceability. An offer invites acceptance on stated terms; a counteroffer generally proposes different terms. Always identify the governing jurisdiction and facts.',check:'Practice: What changed when the other party counteroffered?'},
{title:'Criminal Law: Elements & Intent',body:'Analyze each element of a charged offense separately, including any required mental state. Distinguish suspicion from evidence and remember that prosecutors bear the burden of proof beyond a reasonable doubt.',check:'Practice: Which facts establish conduct, and which establish intent?'},
{title:'Legal Analysis: IRAC',body:'IRAC means Issue, Rule, Application, Conclusion. State the precise legal question, identify the applicable rule, apply it to specific facts and counterarguments, then give a qualified conclusion.',check:'Practice: Write a one-sentence issue statement before analyzing.'}
];
const stages=[
{title:'Assignment 001 — Initial Review',memo:'Alexandra Bennett, Supervising Attorney: A vendor received eight invoices for $9,850 each over two weeks. Company policy requires secondary approval for invoices of $10,000 or more. A manager approved all eight. We do not yet know whether the invoices represent separate services.',prompt:'What are the first three factual questions you would investigate, and why?',feedback:'Strong first steps include preserving source records, comparing invoices with contracts and deliverables, identifying who requested the split amounts, and avoiding an assumption of fraud.'},
{title:'Assignment 002 — Witness Interview',memo:'The manager says: “I approved the invoices because finance said they were separate projects.” No written project descriptions have been located.',prompt:'Draft two neutral follow-up questions to distinguish the manager’s personal knowledge from what finance told them.',feedback:'Good questions seek the identity of the source, exact communications, contemporaneous documents, and what the manager independently verified.'},
{title:'Assignment 003 — Supervisor Memo',memo:'Finance confirms the vendor performed some work, but the scope and allocation across invoices remain unclear. Your supervisor requests a short preliminary recommendation.',prompt:'Write a concise recommendation explaining what is known, what remains uncertain, and what evidence should be obtained next.',feedback:'A strong memo separates established facts from allegations, proposes proportionate preservation and verification steps, and avoids premature conclusions.'}
];
function el(){return document.getElementById('view')}
function nav(){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}
function go(p){page=p;chosen=null;nav();render();window.scrollTo(0,0)}
function card(title,body){return `<article class="card"><h3>${title}</h3>${body}</article>`}
function render(){nav();let h='';
if(page==='home'){h=`<section class="hero"><div class="tag">YOUR PRIVATE LEGAL HEADQUARTERS</div><h1>Learn the law.<br>Build your case.</h1><p>Welcome to your office. Your assignments are waiting.</p><button class="btn primary" onclick="go('firm')">Enter the Firm</button><button class="btn" onclick="go('academy')">Enter the Academy</button></section><div class="grid">${card('INBOX','<p>Alexandra Bennett has assigned a financial misconduct review.</p><button class="btn" onclick="go(\'firm\')">Open assignment</button>'.replaceAll("\'","'"))}${card('LSAT LAB',`<p>${Object.keys(data.answered).length} of ${questions.length} questions completed.</p><button class="btn" onclick="go('academy')">Practice now</button>`)}${card('WEEKLY DOCKET','<p>Monday · Law Simulation<br>Thursday · LSAT Practice<br>12:00 PM Eastern</p><button class="btn" onclick="go(\'docket\')">View docket</button>'.replaceAll("\'","'"))}</div>`}
if(page==='academy'){h=`<div class="hero"><div class="tag">THE ACADEMY</div><h1>Study with purpose.</h1><p>Original LSAT-style practice and introductory legal foundations.</p></div><div class="grid">${card('LSAT Lab',`<p>5 original practice questions with detailed explanations.</p><button class="btn primary" onclick="page='lsat';render()">Open LSAT Lab</button>`)}${card('Law 101',`<p>Contracts, criminal law, and legal analysis.</p><button class="btn" onclick="page='lessons';render()">Open lessons</button>`)}</div>`}
if(page==='lsat'){let q=questions[question],saved=data.answered[question];h=`<div class="panel"><div class="tag">LSAT LAB / ${q.type.toUpperCase()}</div><h1>Question ${question+1} of ${questions.length}</h1><p>${q.q}</p>${q.a.map((a,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="choose(${i})" ${saved!==undefined?'disabled':''}>${String.fromCharCode(65+i)}. ${a}</button>`).join('')}${saved===undefined?`<button class="btn primary" onclick="submitAnswer()" ${chosen===null?'disabled':''}>Submit answer</button>`:`<div class="notice"><b>${saved===q.correct?'Correct':'Not quite'}.</b> Correct answer: ${String.fromCharCode(65+q.correct)}. ${q.why}</div>`}<div><button class="btn" onclick="question=Math.max(0,question-1);chosen=null;render()">Previous</button><button class="btn" onclick="question=Math.min(${questions.length-1},question+1);chosen=null;render()">Next</button></div><button class="btn" onclick="go('academy')">Back to Academy</button></div>`}
if(page==='lessons'){h=`<div class="hero"><div class="tag">LAW 101</div><h1>Legal Foundations</h1></div><div class="grid">${lessons.map((l,i)=>card(l.title,`<p>${l.body}</p><p class="muted">${l.check}</p><button class="btn ${data.lessons.includes(i)?'':'primary'}" onclick="completeLesson(${i})">${data.lessons.includes(i)?'Completed ✓':'Mark lesson complete'}</button>`)).join('')}</div>`}
if(page==='firm'){let s=stages[Math.min(data.caseStep,stages.length-1)];h=`<div class="hero"><div class="tag">THE FIRM / INVESTIGATIONS</div><h1>Your office. Your case.</h1><p>Supervising Attorney: Alexandra Bennett · Fictional simulation</p></div><div class="panel">${card(s.title,`<p>${s.memo}</p>`)}<h3>Your assignment</h3><p>${s.prompt}</p><textarea id="caseNote" placeholder="Write your professional response here...">${data.caseNotes[data.caseStep]||''}</textarea><div><button class="btn" onclick="saveNote()">Save draft</button><button class="btn primary" onclick="finishStage()">Submit to supervisor</button></div>${data.caseNotes['review'+data.caseStep]?`<div class="notice"><b>Supervisor's coaching notes:</b> ${s.feedback}<p>Review your own response against these criteria; this version does not automatically grade free-text answers.</p></div>`:''}${data.caseStep>0?'<button class="btn" onclick="data.caseStep--;save();render()">Previous assignment</button>':''}${data.caseStep<stages.length-1&&data.caseNotes['review'+data.caseStep]?'<button class="btn primary" onclick="data.caseStep++;save();render()">Next assignment</button>':''}</div>`}
if(page==='docket'){h=`<div class="hero"><div class="tag">WEEKLY DOCKET</div><h1>Your standing assignments.</h1></div><div class="grid">${card('MONDAY · 12:00 PM ET','<h3>Law Simulation</h3><p>Complete the current case inside The Firm. New live assignments are not automatically synced from ChatGPT yet.</p><button class="btn" onclick="go(\'firm\')">Open The Firm</button>'.replaceAll("\'","'"))}${card('THURSDAY · 12:00 PM ET','<h3>LSAT Practice</h3><p>Work through original questions in the Academy. ChatGPT reminders remain separate.</p><button class="btn" onclick="go(\'academy\')">Open The Academy</button>'.replaceAll("\'","'"))}</div>`}
if(page==='progress'){let total=Object.keys(data.answered).length,correct=Object.entries(data.answered).filter(([k,v])=>questions[+k].correct===v).length;h=`<div class="hero"><div class="tag">YOUR PERFORMANCE CENTER</div><h1>Progress, not perfection.</h1></div><div class="grid">${card('LSAT ANSWERED',`<div class="metric">${total}/${questions.length}</div>`)}${card('ACCURACY',`<div class="metric">${total?Math.round(correct/total*100)+'%':'—'}</div>`)}${card('LESSONS COMPLETED',`<div class="metric">${data.lessons.length}/${lessons.length}</div>`)}</div><p><button class="btn" onclick="exportData()">Export progress backup</button><label class="btn">Import backup <input type="file" accept=".json" onchange="importData(event)" hidden></label></p><p class="muted">Progress is stored on this device only. Export a backup before changing devices or clearing browser data.</p>`}
el().innerHTML=h}
function choose(i){chosen=i;render();chosen=i;document.querySelectorAll('.option')[i].classList.add('selected');document.querySelectorAll('.option').forEach((x,j)=>x.classList.toggle('selected',i===j));document.querySelector('.btn.primary').disabled=false}
function submitAnswer(){if(chosen===null)return;data.answered[question]=chosen;save();render()}
function completeLesson(i){if(!data.lessons.includes(i))data.lessons.push(i);save();render()}
function saveNote(){data.caseNotes[data.caseStep]=document.getElementById('caseNote').value;save();alert('Draft saved in this browser.')}
function finishStage(){let v=document.getElementById('caseNote').value.trim();if(v.length<20){alert('Please write at least a couple of sentences.');return}data.caseNotes[data.caseStep]=v;data.caseNotes['review'+data.caseStep]=true;save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='the-brief-progress.json';a.click();URL.revokeObjectURL(url)}
function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let o=JSON.parse(t);if(!o||typeof o!=='object'||!o.answered||!o.caseNotes||!Array.isArray(o.lessons))throw Error();data={...initial,...o};save();render();alert('Progress imported')}catch(err){alert('This is not a valid THE BRIEF. backup')}})}
render();
</script></body></html>
